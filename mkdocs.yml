site_name: زیست‌شناسی پایه دهم | BIOLOS
site_url: https://biolos-platform.github.io/

theme:
  name: material
  language: fa
  direction: rtl
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: حالت شب
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: حالت روز
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - admonition
  - def_list
